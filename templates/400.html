{% extends 'base.html' %}
{% block title %}400 Bad Request — CampusPro{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <i class="bi bi-exclamation-triangle display-1 text-warning mb-3"></i>
    <h1 class="display-4 fw-bold">400</h1>
    <h4>Bad Request</h4>
    <p class="text-muted">The server could not understand your request. Please go back and try again.</p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-2">
      <i class="bi bi-house me-1"></i>Go to My Dashboard
    </a>
  </div>
</div>
{% endblock %}
