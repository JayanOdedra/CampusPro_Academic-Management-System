{% extends 'base.html' %}
{% block title %}Check your e-mail — CampusPro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center mt-4">
    <i class="bi bi-envelope-check display-3 text-success"></i>
    <h4 class="mt-3">Check your e-mail</h4>
    <p class="text-muted">If an account exists for that address, we have sent a password reset link.
      (In development the e-mail is printed in the terminal.)</p>
    <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
  </div>
</div>
{% endblock %}
